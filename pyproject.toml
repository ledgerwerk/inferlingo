[build-system]
requires = ["setuptools>=80", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "inferlingo"
dynamic = ["version"]
description = "An explainable Python rule engine for deriving policy and impact from application facts."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "holgern" }]
keywords = ["rule-engine", "policy", "eligibility", "provenance", "inference"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "typer>=0.16,<1",
  "tomli>=2,<3; python_version < '3.11'",
]

[project.optional-dependencies]
jev = [
  "pyjev>=0.1.0,<1",
]
dev = [
  "pytest>=9,<10",
  "pyjev>=0.1.0,<1",
  "ruff>=0.16,<1",
  "build>=1,<2",
  "twine>=6,<7",
]

docs = [
  "sphinx>=7,<9",
  "myst-parser>=2,<5",
  "sphinx-rtd-theme>=2,<4",
]

[project.urls]
Repository = "https://github.com/ledgerwerk/inferlingo"

[project.scripts]
inferlingo = "inferlingo.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["inferlingo*"]

[tool.setuptools.package-data]
inferlingo = ["py.typed"]

[tool.setuptools_scm]
version_file = "inferlingo/_version.py"
fallback_version = "0.0.0"
parentdir_prefix_version = "inferlingo-"
local_scheme = "no-local-version"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
