    observed_behavior:
      Added immutable RuleSet, structured Fact, and isolated Session
      evaluation; rule files can be composed, runtime values are quoted safely, and
      results expose convenience accessors. The parser accepts named-rule metadata,
      proof explanations resolve query bindings and show evidence provenance, and the
      CLI supports rule/fact file composition, exact offline queries, and TOML scenarios.
      New release-policy examples and API, CLI, and rule-modeling guides exercise these
      workflows.
